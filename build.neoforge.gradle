plugins {
	id 'net.neoforged.moddev'
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}-neoforge"
group = project.maven_group
def targetJavaVersion = Integer.parseInt(project.java_version as String)

base {
	archivesName = 'be_careful'
}

sourceSets.main.java.exclude '**/loaders/fabric/**'
sourceSets.main.java.srcDir rootProject.file('versions/1.21.1-fabric/build/generated/stonecutter/client/java')
sourceSets.main.java.exclude '**/client/BeCarefulClient.java'
sourceSets.main.resources.srcDir rootProject.file('src/client/resources')

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
	maven {
		name = 'Rosetta'
		url = 'https://raw.githubusercontent.com/Rasa-Novum/Rosetta_Library/maven/'
		content { includeGroup 'com.rasanovum.rosetta' }
	}
	mavenCentral()
}

neoForge {
	version = project.neoforge_version
	runs {
		register('client') {
			client()
			ideName = 'Be Careful 1.21.1 NeoForge Client'
		}
		register('server') {
			server()
			ideName = 'Be Careful 1.21.1 NeoForge Server'
		}
	}
	mods {
		register('be_careful') { sourceSet sourceSets.main }
	}
}

dependencies {
	implementation "maven.modrinth:midnightlib:${project.midnightlib_version}"
	implementation "com.rasanovum.rosetta:rosetta-${project.minecraft_version}-neoforge:${project.rosetta_version}"
}

tasks.withType(JavaCompile).configureEach {
	dependsOn project(':1.21.1-fabric').tasks.named('stonecutterGenerateClient')
	options.release = targetJavaVersion
}

tasks.withType(Jar).configureEach {
	if (name == 'sourcesJar') dependsOn project(':1.21.1-fabric').tasks.named('stonecutterGenerateClient')
}

tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}
}

processResources {
	def modVersion = project.version
	inputs.properties 'version': modVersion, 'minecraft_version': project.minecraft_version,
			'neoforge_version': project.neoforge_version, 'java_version': project.java_version
	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': modVersion, 'minecraft_version': project.minecraft_version,
				'neoforge_version': project.neoforge_version, 'java_version': project.java_version
	}
	filesMatching('be_careful*.mixins.json') {
		filter { line -> line.replace('"compatibilityLevel": "JAVA_17"', '"compatibilityLevel": "JAVA_21"') }
	}
	eachFile { details ->
		details.path = details.path
				.replace('/recipes/', '/recipe/')
				.replace('/advancements/', '/advancement/')
				.replace('/loot_tables/', '/loot_table/')
				.replace('/tags/items/', '/tags/item/')
				.replace('/tags/blocks/', '/tags/block/')
	}
	filesMatching('data/**/recipes/*.json') {
		def inResult = false
		filter { line ->
			if (line.contains('"result"')) inResult = true
			if (inResult && line.contains('"item":')) {
				inResult = false
				return line.replace('"item":', '"id":')
			}
			line
		}
	}
	filesMatching('data/**/advancements/**/*.json') {
		def inIcon = false
		filter { line ->
			if (line.contains('"icon"')) inIcon = true
			if (inIcon && line.contains('"item":')) {
				inIcon = false
				return line.replace('"item":', '"id":')
			}
			line
		}
	}
	exclude 'fabric.mod.json'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
	targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

jar {
	from('LICENSE.md') { rename { "${it}_be_careful" } }
}

publishing {
	publications {
		create('mavenJava', MavenPublication) { from components.java }
	}
}
